<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — University SMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" style="background:#111;">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon" style="background:#000;border:2px solid #e5e5e5;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Admin Portal</h1>
        <p>University Student Management System</p>
      </div>

      <h2 class="auth-title">Administrator Login</h2>
      <p class="auth-subtitle">Restricted access — authorized personnel only</p>

      <div id="alertBox" style="display:none;padding:.75rem 1rem;border-radius:6px;margin-bottom:1.25rem;font-size:.875rem;"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@university.edu" autocomplete="email" required>
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label class="form-label" for="password">Password</label>
          <div class="input-group-password">
            <input type="password" id="password" class="form-control" placeholder="Enter admin password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" onclick="togglePass('password', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-shield-check"></i> Sign In as Admin
        </button>
      </form>

      <hr class="divider">
      <p style="text-align:center;font-size:.875rem;color:#666;">
        <a href="login.html" style="color:#000;font-weight:600;">← Student login</a>
      </p>
    </div>
  </div>

  <script>
    // Redirect if already logged in as admin
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('userRole');
    if (token && role === 'ADMIN') window.location.href = 'admin-dashboard.html';

    function togglePass(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { input.type = 'password'; icon.className = 'bi bi-eye'; }
    }

    function showAlert(el, type, msg) {
      el.style.display = 'block';
      el.style.background = type === 'error' ? '#fff0f0' : '#f0fff4';
      el.style.border = type === 'error' ? '1px solid #fcc' : '1px solid #9b9';
      el.style.color = type === 'error' ? '#c00' : '#333';
      el.textContent = msg;
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert(alertBox, 'error', 'Please fill in all fields.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Authenticating...';

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userRole', data.user.role);
          localStorage.setItem('userName', data.user.fullName);
          localStorage.setItem('userId', data.user.id);
          showAlert(alertBox, 'success', 'Admin authenticated. Redirecting...');
          setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 800);
        } else {
          showAlert(alertBox, 'error', data.message || 'Invalid admin credentials');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-shield-check"></i> Sign In as Admin';
        }
      } catch (err) {
        showAlert(alertBox, 'error', 'Cannot connect to server. Is the backend running?');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check"></i> Sign In as Admin';
      }
    });
  </script>
</body>
</html>
