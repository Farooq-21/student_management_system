<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University SMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="redirect-page">
    <div style="text-align:center;">
      <div style="width:64px;height:64px;background:#000;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1.5rem;">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 style="font-size:1.5rem;margin-bottom:0.5rem;">University SMS</h1>
      <p style="color:#666;margin-bottom:2rem;">Student Management System</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <a href="login.html" style="display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;background:#000;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;font-size:.9rem;">Student Login</a>
        <a href="admin-login.html" style="display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;background:transparent;color:#000;border:1.5px solid #000;border-radius:6px;text-decoration:none;font-weight:600;font-size:.9rem;">Admin Login</a>
      </div>
    </div>
  </div>
  <script>
    // Auto-redirect based on stored token
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('userRole');
    if (token && role === 'ADMIN') window.location.href = 'admin-dashboard.html';
    else if (token && role === 'STUDENT') window.location.href = 'student-dashboard.html';
  </script>
</body>
</html>
