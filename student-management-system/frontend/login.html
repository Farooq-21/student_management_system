<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — University SMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <h1>University SMS</h1>
        <p>Student Management System</p>
      </div>

      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to your student account</p>

      <div id="alertBox" class="alert-box" style="display:none;padding:.75rem 1rem;border-radius:6px;margin-bottom:1.25rem;font-size:.875rem;"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" autocomplete="email" required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group-password">
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" onclick="togglePass('password', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
          <div class="form-check" style="margin:0;">
            <input class="form-check-input" type="checkbox" id="rememberMe" style="width:16px;height:16px;cursor:pointer;border:1.5px solid #ccc;border-radius:3px;">
            <label class="form-check-label" for="rememberMe" style="font-size:.875rem;cursor:pointer;margin-left:.5rem;color:#333;">Remember me</label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>
      </form>

      <hr class="divider">

      <p style="text-align:center;font-size:.875rem;color:#666;margin-bottom:.75rem;">
        Don't have an account? <a href="signup.html" style="font-weight:600;color:#000;">Create account</a>
      </p>
      <p style="text-align:center;font-size:.875rem;color:#666;">
        Are you an admin? <a href="admin-login.html" style="font-weight:600;color:#000;">Admin login →</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('userRole');
    if (token && role === 'STUDENT') window.location.href = 'student-dashboard.html';
    if (token && role === 'ADMIN') window.location.href = 'admin-dashboard.html';

    function togglePass(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alert = document.getElementById('alertBox');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert(alert, 'error', 'Please fill in all fields.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userRole', data.user.role);
          localStorage.setItem('userName', data.user.fullName);
          localStorage.setItem('userId', data.user.id);
          if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('rememberedEmail', email);
          }
          showAlert(alert, 'success', 'Login successful! Redirecting...');
          setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 800);
        } else {
          showAlert(alert, 'error', data.message || 'Invalid credentials');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert(alert, 'error', 'Cannot connect to server. Is the backend running?');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Auto-fill remembered email
    const remembered = localStorage.getItem('rememberedEmail');
    if (remembered) {
      document.getElementById('email').value = remembered;
      document.getElementById('rememberMe').checked = true;
    }

    function showAlert(el, type, msg) {
      el.style.display = 'block';
      el.style.background = type === 'error' ? '#fff0f0' : '#f0fff4';
      el.style.border = type === 'error' ? '1px solid #fcc' : '1px solid #9b9';
      el.style.color = type === 'error' ? '#c00' : '#333';
      el.textContent = msg;
    }
  </script>
</body>
</html>
