<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — University SMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
        <h1>University SMS</h1>
        <p>Student Management System</p>
      </div>

      <h2 class="auth-title">Create your account</h2>
      <p class="auth-subtitle">Join as a student to get started</p>

      <div id="alertBox" class="alert-box" style="display:none;padding:.75rem 1rem;border-radius:6px;margin-bottom:1.25rem;font-size:.875rem;"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Muhammad Ali Khan" autocomplete="name" required>
          <div class="invalid-feedback">Full name is required.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" autocomplete="email" required>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group-password">
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" autocomplete="new-password" required>
            <button type="button" class="toggle-password" onclick="togglePass('password', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <div class="input-group-password">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" required>
            <button type="button" class="toggle-password" onclick="togglePass('confirmPassword', this)">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="confirmFeedback">Passwords do not match.</div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          Create Account
        </button>
      </form>

      <hr class="divider">
      <p style="text-align:center;font-size:.875rem;color:#666;">
        Already have an account? <a href="login.html" style="font-weight:600;color:#000;">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    function togglePass(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text'; icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password'; icon.className = 'bi bi-eye';
      }
    }

    function showAlert(el, type, msg) {
      el.style.display = 'block';
      el.style.background = type === 'error' ? '#fff0f0' : '#f0fff4';
      el.style.border = type === 'error' ? '1px solid #fcc' : '1px solid #9b9';
      el.style.color = type === 'error' ? '#c00' : '#333';
      el.textContent = msg;
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alert = document.getElementById('alertBox');
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validation
      let valid = true;
      if (!fullName) { document.getElementById('fullName').classList.add('is-invalid'); valid = false; }
      else document.getElementById('fullName').classList.remove('is-invalid');

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('email').classList.add('is-invalid'); valid = false;
      } else document.getElementById('email').classList.remove('is-invalid');

      if (!password || password.length < 6) {
        document.getElementById('password').classList.add('is-invalid'); valid = false;
      } else document.getElementById('password').classList.remove('is-invalid');

      if (password !== confirmPassword) {
        document.getElementById('confirmPassword').classList.add('is-invalid');
        document.getElementById('confirmFeedback').textContent = 'Passwords do not match.';
        valid = false;
      } else document.getElementById('confirmPassword').classList.remove('is-invalid');

      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, confirmPassword }),
        });
        const data = await res.json();

        if (data.success) {
          showAlert(alert, 'success', 'Account created! Redirecting to login...');
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          showAlert(alert, 'error', data.message || 'Signup failed');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch (err) {
        showAlert(alert, 'error', 'Cannot connect to server. Is the backend running?');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
